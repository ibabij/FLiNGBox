name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Electron App
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only one portable executable
        shell: pwsh
        run: |
          $exes = Get-ChildItem dist/*.exe
          if ($exes.Count -gt 1) {
            Write-Host "Found $($exes.Count) exes, keeping only the first: $($exes[0].Name)"
            $exes | Select-Object -Skip 1 | Remove-Item -Force
          }
          Rename-Item -Path $exes[0].FullName -NewName "FLiNG-Box-Portable.exe" -Force

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/FLiNG-Box-Portable.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
