name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Electron App
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only one portable executable
        shell: pwsh
        run: |
          $exes = Get-ChildItem dist/*.exe
          Write-Host "dist exes: $($exes.Name -join ', ')"
          $first = $exes | Select-Object -First 1
          Move-Item -Path $first.FullName -Destination "$env:RUNNER_TEMP\FLiNG-Box-Portable.exe" -Force
          Get-ChildItem dist/*.exe | Remove-Item -Force
          Move-Item -Path "$env:RUNNER_TEMP\FLiNG-Box-Portable.exe" -Destination "dist/FLiNG-Box-Portable.exe" -Force
          Write-Host "after cleanup: $((Get-ChildItem dist/*.exe).Name -join ', ')"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/FLiNG-Box-Portable.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
